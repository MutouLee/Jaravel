name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 示例不继承 jaravel-parent,并通过 annotationProcessorPaths /
      # <plugin> 引用 io.jaravel 的 SNAPSHOT 构件。Maven 不会把这些
      # 从 reactor 解析,所以先安装框架模块;jaravel-coverage 依赖
      # 示例构件,也一起排除 —— 第二阶段在完整 reactor 里解析。
      - name: install framework artifacts
        run: >
          mvn -B -ntp -Dmaven.test.skip=true install
          -pl '!examples/todo,!examples/blog,!examples/auth,!examples/queue,!examples/api-only,!examples/multi-tenant,!jaravel-coverage'

      # 默认套件不依赖外部服务:浏览器 / Testcontainers / Redis / broker
      # 相关测试按开关跳过。需要真实服务的作业另开。
      - name: mvn test
        run: |
          set -o pipefail
          mkdir -p target
          mvn -B -ntp test 2>&1 | tee target/ci-test.log

      - name: test failures summary
        if: failure()
        run: |
          files=$(grep -rlE 'Failures: [1-9]|Errors: [1-9]' \
                  --include='*.txt' . | head -n 10)
          {
            echo "## Test failures"
            if [ -z "$files" ]; then
              echo "No surefire failure files; last 80 lines of the Maven log:"
              echo '```'
              tail -n 80 target/ci-test.log
              echo '```'
            else
              while IFS= read -r f; do
                echo "### $f"
                head -n 80 "$f"
              done <<< "$files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 断言原文也进注解:注解可以匿名读取(下载 artifact 要登录),
          # 失败时第一个入口就能看到「期望 / 实际」,而不是只有测试名。
          if [ -n "$files" ]; then
            while IFS= read -r f; do
              body=$(head -n 120 "$f")
              body=${body//\%/%25}
              body=${body//$'\r'/}
              body=${body//$'\n'/%0A}
              echo "::error title=$(basename "$f")::$body"
            done <<< "$files"
          else
            body=$(tail -n 60 target/ci-test.log)
            body=${body//\%/%25}
            body=${body//$'\r'/}
            body=${body//$'\n'/%0A}
            echo "::error title=maven::$body"
          fi

      - name: upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/
            **/target/*.dumpstream
            target/ci-test.log

  parity:
    name: parity gate (≤ 1.30)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: parity-check
        run: python benchmark/laravel-parity/parity.py --max 1.3

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict

  dependency-convergence:
    name: dependency convergence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: install framework artifacts
        run: >
          mvn -B -ntp -Dmaven.test.skip=true install
          -pl '!examples/todo,!examples/blog,!examples/auth,!examples/queue,!examples/api-only,!examples/multi-tenant,!jaravel-coverage'
      - run: mvn -B -ntp -Psecurity -DskipTests validate
