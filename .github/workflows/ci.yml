name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Maven 下载失败就重试(Maven 3.9+ 读 MAVEN_ARGS,会拼在命令行参数前面)。
#
# ★ 为什么需要这个:6b09653 的 test 作业挂在
#   「Could not find artifact org.apache.maven.surefire:surefire-junit-platform:jar:3.5.2」
# —— 不是代码问题,是一次 Central 抖动。它恰好发生在**冷缓存**那一跑上
# (上一个提交改了 pom,setup-java 的缓存键跟着变),于是那一跑要下载
# 全部依赖,撞上抖动的概率也最高。
#
# 默认的 wagon 不重试:一次 404/超时就直接判失败,而那条错误看起来
# 像「这个依赖不存在」。重试三次把「抖动」与「真的没有这个坐标」
# 区分开 —— 后者重试三次仍然失败,消息也不会更误导。
env:
  MAVEN_ARGS: >-
    -Dmaven.wagon.http.retryHandler.count=3
    -Dmaven.wagon.http.retryHandler.requestSentEnabled=true

jobs:
  test:
    name: test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 示例不继承 jaravel-parent,并通过 annotationProcessorPaths /
      # <plugin> 引用 io.jaravel 的 SNAPSHOT 构件。Maven 不会把这些
      # 从 reactor 解析,所以先安装框架模块;jaravel-coverage 依赖
      # 示例构件,也一起排除 —— 第二阶段在完整 reactor 里解析。
      - name: install framework artifacts
        run: >
          mvn -B -ntp -Dmaven.test.skip=true install
          -pl '!examples/todo,!examples/blog,!examples/auth,!examples/queue,!examples/api-only,!examples/multi-tenant,!jaravel-coverage'

      # 默认套件不依赖外部服务:浏览器 / Testcontainers / Redis / broker
      # 相关测试按开关跳过。需要真实服务的作业另开。
      - name: mvn test
        run: |
          set -o pipefail
          mkdir -p target
          mvn -B -ntp test 2>&1 | tee target/ci-test.log

      - name: test failures summary
        if: failure()
        run: |
          files=$(grep -rlE 'Failures: [1-9]|Errors: [1-9]' \
                  --include='*.txt' . 2>/dev/null | head -n 8 || true)
          {
            echo "## Test failures"
            if [ -z "$files" ]; then
              echo "No surefire failure files; last 80 lines of the Maven log:"
              echo '```'
              tail -n 80 target/ci-test.log
              echo '```'
            else
              while IFS= read -r f; do
                echo "### $f"
                head -n 80 "$f"
              done <<< "$files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 注解可以匿名读取(下载 artifact 要登录)。Maven 控制台里
          # 失败详情跟着 "<<< FAILURE!" 一行,把它连同后文一起发出来,
          # 就是「期望 / 实际」的原文,而不是只有测试名。
          emit() {
            local title="$1" body="$2"
            body=${body//\%/%25}
            body=${body//$'\r'/}
            body=${body//$'\n'/%0A}
            echo "::error title=${title}::${body}"
          }

          if [ -n "$files" ]; then
            while IFS= read -r f; do
              emit "$(basename "$f")" "$(head -n 120 "$f")"
            done <<< "$files"
          fi

          # 框架自己打的告警行(丢失的批次回调、重试过的批次计数、
          # 驱动层的异常)。它们解释的正是那种「断言看起来毫无道理」的失败:
          # 测试只会说「list 里没有 finally:…」,而原因是一次 push 撞上写锁
          # 之后被吞掉了 —— 那行字在日志里,却从来没人看得到(下载 artifact
          # 要登录,而注解不要)。
          warnings=$(grep -E '^\[jaravel\]' target/ci-test.log | head -n 40 || true)
          if [ -n "$warnings" ]; then
            emit "jaravel-warnings" "$warnings"
            {
              echo "### 框架告警([jaravel] 开头的行)"
              echo '```'
              echo "$warnings"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          body=$(grep -E -B 1 -A 25 '<<< (FAILURE|ERROR)!' target/ci-test.log \
                 | head -n 250 || true)
          if [ -n "$body" ]; then
            emit "maven-failures" "$body"
          else
            emit "maven" "$(grep -E 'forked VM|dumpstream|Error occurred|\[ERROR\]' \
                             target/ci-test.log | head -n 120 || true)"
          fi

      - name: upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/
            **/target/*.dumpstream
            target/ci-test.log

  brokers:
    name: broker contract tests (redis / rabbitmq / sqs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 默认 test 作业按开关跳过这些类(见那里的注释)。
    #
    # ★ 为什么要单独一个作业:跳过的测试不是绿色,是**没测**。
    # 这三个驱动的正确性全在「与真 broker 的那一层接线」上
    # (ack 的时机、可见性超时、broker 自己的投递计数),
    # 而那些在内存替身上一条都测不出来 —— 在这个作业出现之前,
    # 它们只在有人记得本地起容器时跑过。
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      rabbitmq:
        # quorum 队列(x-delivery-count)要 3.8+
        image: rabbitmq:3-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s
          --health-timeout 5s --health-retries 12
      elasticmq:
        # SQS 兼容;LocalStack 太重,而这里只用到队列那部分
        image: softwaremill/elasticmq-native
        ports: ["9324:9324"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: install framework artifacts
        run: >
          mvn -B -ntp -Dmaven.test.skip=true install
          -pl '!examples/todo,!examples/blog,!examples/auth,!examples/queue,!examples/api-only,!examples/multi-tenant,!jaravel-coverage'

      # ElasticMQ 没有 health-cmd(镜像里没有 shell 工具),所以在这里等端口
      - name: wait for elasticmq
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9324) 2>/dev/null; then
              echo "elasticmq ready"; exit 0
            fi
            sleep 2
          done
          echo "elasticmq 没起来"; exit 1

      # ★ 不是 -Dtest=...:那样漏掉新加的 broker 测试类时没人会发现。
      # 整个 jaravel-queue + jaravel-cache 跑一遍,开关一开,
      # 原本 skip 的那些类自己就醒了。
      - name: broker contract tests
        env:
          JARAVEL_TEST_REDIS_URI: redis://127.0.0.1:6379/15
          JARAVEL_TEST_RABBITMQ_URI: amqp://guest:guest@127.0.0.1:5672/%2f
          JARAVEL_TEST_SQS_ENDPOINT: http://127.0.0.1:9324
        run: |
          set -o pipefail
          mkdir -p target
          mvn -B -ntp test -pl jaravel-queue,jaravel-cache             2>&1 | tee target/ci-brokers.log

      - name: upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-brokers
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/
            target/ci-brokers.log

  parity:
    name: parity gate (≤ 1.30)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: parity-check
        run: python benchmark/laravel-parity/parity.py --max 1.3

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      # 公开 API 的文档覆盖(v1.0 验收第 2 条):每个公开类型都有 Javadoc,
      # 每个有公开 API 的模块都在 api-reference.md 的模块索引里,
      # 且索引里没有改名后留下的死类型名。
      - name: api coverage (--strict)
        run: python tools/api_coverage.py --strict

  dependency-convergence:
    name: dependency convergence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: install framework artifacts
        run: >
          mvn -B -ntp -Dmaven.test.skip=true install
          -pl '!examples/todo,!examples/blog,!examples/auth,!examples/queue,!examples/api-only,!examples/multi-tenant,!jaravel-coverage'
      - run: mvn -B -ntp -Psecurity -DskipTests validate
