name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 默认套件不依赖外部服务:浏览器 / Testcontainers / Redis / broker
      # 相关测试按开关跳过。需要真实服务的作业另开。
      - name: mvn test
        run: mvn -B -ntp test

      - name: upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/
            **/target/*.dumpstream

  parity:
    name: parity gate (≤ 1.30)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: parity-check
        run: python benchmark/laravel-parity/parity.py --max 1.3

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict

  dependency-convergence:
    name: dependency convergence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -Psecurity -DskipTests validate
