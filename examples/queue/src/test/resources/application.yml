# 测试配置。
#
# ⚠ src/test/resources/application.yml 会**整体覆盖** main 里的那一份
#   (测试资源在 classpath 上排在前面),不是合并 —— 所以这里必须写全。
#   只写几个想改的键,症状是「Failed to determine a suitable driver class」,
#   而那看起来完全像是数据源配置写错了。

spring:
  datasource:
    # 内存库 + 共享缓存。cache=shared 是必需的:没有它连接池里每条连接
    # 各看到一个**空的**独立数据库,于是「迁移在连接 A 上建了表,
    # 查询走连接 B 就报 no such table」—— 那看起来像迁移没跑。
    #
    # 对队列来说这一条尤其关键:worker 跑在**另一个线程**上,
    # 它拿到的连接与请求线程不是同一条。没有 cache=shared 的话
    # worker 会看到一个空库,症状是「任务投进去了但 worker 说队列是空的」。
    url: jdbc:sqlite:file:queuetest?mode=memory&cache=shared
    driver-class-name: org.sqlite.JDBC

logging:
  level:
    root: WARN
    io.jaravel: WARN
