server:
  port: ${SERVER_PORT:8000}

spring:
  datasource:
    # 文件型 SQLite:重启后数据还在
    url: ${DB_URL:jdbc:sqlite:storage/todo.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    root: WARN
    io.jaravel: INFO
