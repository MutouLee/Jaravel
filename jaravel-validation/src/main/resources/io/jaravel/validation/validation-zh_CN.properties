# Jaravel 校验消息(简体中文)
# 用户可用 resources/lang/zh_CN/validation.properties 覆盖其中任意一条。

__headline=给定数据无效。

# ---- 存在性 ----
required=:attribute 不能为空。
present=必须提供 :attribute。
filled=:attribute 不能为空。
prohibited=:attribute 字段被禁止填写。
prohibited_if=当 :other 为 :value 时,:attribute 不能填写。
missing_with=存在 :values 时,:attribute 不能填写。

required_if=当 :other 为 :value 时,:attribute 不能为空。
required_unless=除非 :other 为 :value,:attribute 不能为空。
required_with=存在 :values 时,:attribute 不能为空。
required_with_all=:values 全部存在时,:attribute 不能为空。
required_without=:values 缺失时,:attribute 不能为空。
required_without_all=:values 全部缺失时,:attribute 不能为空。
required_array_keys=:attribute 必须包含以下键::values。

# ---- 类型 ----
string=:attribute 必须是字符串。
integer=:attribute 必须是整数。
numeric=:attribute 必须是数字。
boolean=:attribute 必须是 true 或 false。
array=:attribute 必须是数组。
json=:attribute 必须是有效的 JSON。
decimal=:attribute 必须有 :decimal 位小数。
enum=:attribute 的值无效,可选::values。

# ---- 大小:按值的类型分别措辞 ----
min.string=:attribute 至少 :min 个字符。
min.numeric=:attribute 不能小于 :min。
min.array=:attribute 至少要有 :min 项。
min.file=:attribute 至少 :min KB。
min=:attribute 不能小于 :min。

max.string=:attribute 不能超过 :max 个字符。
max.numeric=:attribute 不能大于 :max。
max.array=:attribute 最多只能有 :max 项。
max.file=:attribute 不能超过 :max KB。
max=:attribute 不能大于 :max。

size.string=:attribute 必须是 :size 个字符。
size.numeric=:attribute 必须等于 :size。
size.array=:attribute 必须包含 :size 项。
size.file=:attribute 必须是 :size KB。
size=:attribute 必须是 :size。

between.string=:attribute 必须在 :min 到 :max 个字符之间。
between.numeric=:attribute 必须在 :min 到 :max 之间。
between.array=:attribute 必须有 :min 到 :max 项。
between.file=:attribute 必须在 :min 到 :max KB 之间。
between=:attribute 必须在 :min 到 :max 之间。

digits=:attribute 必须是 :digits 位数字。
digits_between=:attribute 必须是 :min 到 :max 位数字。
multiple_of=:attribute 必须是 :value 的倍数。
gt=:attribute 必须大于 :value。
gte=:attribute 必须大于或等于 :value。
lt=:attribute 必须小于 :value。
lte=:attribute 必须小于或等于 :value。

# ---- 格式 ----
email=:attribute 必须是有效的邮箱地址。
url=:attribute 必须是有效的网址。
active_url=:attribute 不是一个有效的域名。
ip=:attribute 必须是有效的 IP 地址。
ipv4=:attribute 必须是有效的 IPv4 地址。
ipv6=:attribute 必须是有效的 IPv6 地址。
mac_address=:attribute 必须是有效的 MAC 地址。
uuid=:attribute 必须是有效的 UUID。
ulid=:attribute 必须是有效的 ULID。
alpha=:attribute 只能包含字母。
alpha_num=:attribute 只能包含字母和数字。
alpha_dash=:attribute 只能包含字母、数字、短横线和下划线。
ascii=:attribute 只能包含 ASCII 字符。
hex_color=:attribute 必须是有效的十六进制颜色。
lowercase=:attribute 必须全部小写。
uppercase=:attribute 必须全部大写。
timezone=:attribute 必须是有效的时区。
regex=:attribute 的格式不正确。
not_regex=:attribute 的格式不正确。
starts_with=:attribute 必须以 :values 之一开头。
ends_with=:attribute 必须以 :values 之一结尾。
doesnt_start_with=:attribute 不能以 :values 之一开头。
doesnt_end_with=:attribute 不能以 :values 之一结尾。
contains=:attribute 必须包含 :values。

# ---- 日期 ----
date=:attribute 不是有效的日期。
date_format=:attribute 的格式必须是 :format。
after=:attribute 必须晚于 :date。
after_or_equal=:attribute 必须晚于或等于 :date。
before=:attribute 必须早于 :date。
before_or_equal=:attribute 必须早于或等于 :date。
date_equals=:attribute 必须等于 :date。

# ---- 其它 ----
confirmed=:attribute 两次输入不一致。
same=:attribute 和 :other 必须相同。
different=:attribute 和 :other 必须不同。
in=:attribute 的值无效。
not_in=:attribute 的值无效。
in_array=:attribute 必须存在于 :other 中。
distinct=:attribute 的值重复了。
accepted=必须接受 :attribute。
accepted_if=当 :other 为 :value 时,必须接受 :attribute。
declined=必须拒绝 :attribute。
password=:attribute 至少 :min 个字符,且需满足强度要求。

# ---- 数据库 ----
unique=:attribute 已被占用。
exists=所选的 :attribute 无效。

# ---- 文件 ----
file=:attribute 必须是文件。
image=:attribute 必须是图片。
mimes=:attribute 必须是以下类型的文件::values。
dimensions=:attribute 的图片尺寸不符合要求。
mimetypes=:attribute 必须是这些类型之一：:values。
extensions=:attribute 的扩展名必须是：:values。
